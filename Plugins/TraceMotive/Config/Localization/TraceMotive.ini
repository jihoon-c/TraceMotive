[CommonSettings]
SourcePath=Plugins/TraceMotive/Content/Localization/TraceMotive
DestinationPath=Plugins/TraceMotive/Content/Localization/TraceMotive
ManifestName=TraceMotive.manifest
ArchiveName=TraceMotive.archive
PortableObjectName=TraceMotive.po
ResourceName=TraceMotive.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ko

; Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/TraceMotive/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=true

; Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

; Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

; Write localized text resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
